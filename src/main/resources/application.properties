# Application Configuration
spring.application.name=NutriCheck
server.port=8080

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/nutricheck_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# Initial Administrator Provisioning Configuration
# ===================================================================
# In production, configure through environment variables:
#   NUTRICHECK_ADMIN_USERNAME (e.g. admin)
#   NUTRICHECK_ADMIN_EMAIL    (e.g. admin@nutricheck.com)
#   NUTRICHECK_ADMIN_PASSWORD (required to provision initial admin)
#   NUTRICHECK_ADMIN_FULL_NAME
#   NUTRICHECK_ADMIN_PHONE
#
# If 'nutricheck.admin.password' is unconfigured or empty, initial admin
# provisioning is safely skipped with a logged warning, preventing known default passwords.
nutricheck.admin.username=${NUTRICHECK_ADMIN_USERNAME:admin}
nutricheck.admin.email=${NUTRICHECK_ADMIN_EMAIL:admin@nutricheck.com}
nutricheck.admin.password=${NUTRICHECK_ADMIN_PASSWORD:123456789}
nutricheck.admin.full-name=${NUTRICHECK_ADMIN_FULL_NAME:System Administrator}
nutricheck.admin.phone=${NUTRICHECK_ADMIN_PHONE:+1 555-0199}

# ===================================================================
# Security & Remember-Me Configuration
# ===================================================================
# Set NUTRICHECK_REMEMBER_ME_KEY to a secure random string for production.
# If left unconfigured, an ephemeral session key is generated with an explicit logged notice.
nutricheck.security.remember-me-key=${NUTRICHECK_REMEMBER_ME_KEY:}


# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.nutricheck.nutricheck=INFO
logging.level.org.springframework.security=WARN
