<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Hex Shield with Smooth Corners -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="4.5" y="4.5" width="39" height="39" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Medical Cross Subtle Background Shadow -->
  <path d="M21 11h6v7h7v6h-7v7h-6v-7h-7v-6h7v-7z" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Heartbeat ECG Pulse Wave transitioning into Checkmark -->
  <!-- Flat -> Dip -> Peak -> Valley -> Surge into Checkmark -->
  <path d="M9 25.5 h6.5 l2.2 -4.5 l3.5 10.5 l4.2 -15.5 l3.6 13.5 l2.5 -4 h4.5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        stroke-opacity="0.75"/>

  <!-- Golden Checkmark of Health Verification -->
  <path d="M24 26.5 L29 32 L39 17" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="3.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <path d="M24 26.5 L29 32 L39 17" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Vital Pulse Indicator Dot -->
  <circle cx="39" cy="17" r="2.2" fill="#fef08a"/>
</svg>
