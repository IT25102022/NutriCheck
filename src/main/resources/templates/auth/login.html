<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login - NutriCheck')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="main-content">
        <div class="container container-narrow">
            <div class="card" style="box-shadow: var(--shadow-lg); padding: 2.25rem 2rem;">
                <!-- Brand Header -->
                <div class="card-header" style="justify-content: center; text-align: center; flex-direction: column; gap: 8px; border-bottom: none; padding-bottom: 0;">
                    <img th:src="@{/images/logo.svg}" alt="NutriCheck Health Logo" style="width: 52px; height: 52px; border-radius: 14px; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);">
                    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main); margin-top: 4px;">Welcome to NutriCheck</h1>
                    <p style="font-size: 0.9rem; color: var(--text-muted);">Diet &amp; Clinical Health Management Portal</p>
                </div>

                <!-- Unified Login Form -->
                <form th:action="@{/login}" method="post" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label" for="usernameField">Username or Email Address</label>
                        <input type="text" id="usernameField" name="username" class="form-control" 
                               placeholder="Enter your registered username or email" required autofocus>
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                            <label class="form-label" for="passwordField" style="margin-bottom: 0;">Password</label>
                            <a href="javascript:void(0);" onclick="handleForgotPassword()" 
                               style="font-size: 0.8rem; color: var(--primary-dark); font-weight: 600; text-decoration: none;">Forgot password?</a>
                        </div>
                        <div style="position: relative;">
                            <input type="password" id="passwordField" name="password" class="form-control" 
                                   placeholder="Enter your password" required style="padding-right: 40px;">
                            <button type="button" onclick="togglePasswordVisibility()" 
                                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 4px;"
                                    title="Show/Hide Password" id="togglePasswordBtn">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem;">
                        <input type="checkbox" id="rememberMe" name="remember-me" 
                               style="accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer;">
                        <label for="rememberMe" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer; user-select: none;">
                            Remember this device for 30 days
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem; font-weight: 700; letter-spacing: 0.01em;">
                        Sign In to Portal
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted);">
                    Don't have an account yet? 
                    <a th:href="@{/register}" style="color: var(--primary-dark); font-weight: 700; text-decoration: none; margin-left: 4px;">
                        Create Patient Account
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('passwordField');
            const btn = document.getElementById('togglePasswordBtn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                btn.innerText = '🙈';
            } else {
                passInput.type = 'password';
                btn.innerText = '👁️';
            }
        }

        function handleForgotPassword() {
            alert("For patient and clinical data security, password recovery instructions will be dispatched to your registered email address if an account is found.\n\nPlease contact your clinic administrator if you require immediate credential assistance.");
        }
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
