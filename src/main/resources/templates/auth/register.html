<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register - NutriCheck')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="main-content">
        <div class="container container-narrow">
            <div class="card" style="box-shadow: var(--shadow-lg);">
                <div class="card-header" style="justify-content: center; text-align: center; flex-direction: column; gap: 8px;">
                    <img th:src="@{/images/logo.svg}" alt="NutriCheck Health Logo" style="width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);">
                    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);">Create Patient Account</h1>
                    <p style="font-size: 0.9rem; color: var(--text-muted);">Start tracking your health metrics and receive personalized diet plans</p>
                </div>

                <form th:action="@{/register}" th:object="${user}" method="post">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. Jane Doe" required>
                        <span class="form-text-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                    </div>

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="e.g. janedoe" required>
                            <span class="form-text-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="e.g. jane@example.com" required>
                            <span class="form-text-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>
                    </div>

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Create a secure password" required minlength="6">
                            <span class="form-text-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="e.g. +1 555-0188">
                        </div>
                    </div>

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Age</label>
                            <input type="number" th:field="*{age}" class="form-control" placeholder="e.g. 28" min="5" max="120">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Gender</label>
                            <select th:field="*{gender}" class="form-control">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                        Complete Registration
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                    Already have an account? <a th:href="@{/login}" style="color: var(--secondary-dark); font-weight: 600;">Log In</a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
