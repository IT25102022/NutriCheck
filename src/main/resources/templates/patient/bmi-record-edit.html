<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit BMI Record - NutriCheck')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="main-content">
        <div class="container container-narrow">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">✏️ Edit BMI Measurement</h1>
                    <a th:href="@{/patient/bmi-tracking}" class="btn btn-outline btn-sm">&larr; Back to BMI Tracking</a>
                </div>

                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
                    Update the height or weight below. The BMI value and classification will be recalculated live and saved to your history.
                </p>

                <form th:action="@{/patient/bmi-tracking/edit/{id}(id=${record.id})}" method="post" id="editBmiForm">
                    <div class="grid-cols-3" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1.25rem;">
                        <div class="form-group">
                            <label class="form-label" for="editAge" style="font-weight: 700;">Age (years)</label>
                            <input id="editAge" name="age" type="number"
                                   th:value="${record.age != null ? record.age : (user != null ? user.age : '')}" class="form-control" min="1" max="120">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="editHeightCm" style="font-weight: 700;">Height (cm) *</label>
                            <input id="editHeightCm" name="heightCm" type="number" step="0.1"
                                   th:value="${record.heightCm}" class="form-control" required min="50" max="280" oninput="updateEditLiveBmi()">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="editWeightKg" style="font-weight: 700;">Weight (kg) *</label>
                            <input id="editWeightKg" name="weightKg" type="number" step="0.1"
                                   th:value="${record.weightKg}" class="form-control" required min="20" max="400" oninput="updateEditLiveBmi()">
                        </div>
                    </div>

                    <!-- Live Recalculation Preview Box -->
                    <div class="card" style="background: var(--bg-card-subtle, #f8fafc); margin: 1.25rem 0; padding: 1.25rem; border: 1px solid var(--border-color);">
                        <strong style="font-size: 0.9rem; color: var(--text-main);">Updated Calculation Preview</strong>
                        <div style="margin-top: 0.5rem; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                            <div>
                                BMI: <strong id="editLiveBmi" style="font-size: 1.25rem; color: var(--primary-dark);" th:text="${record.bmiValue}">22.86</strong>
                            </div>
                            <div>
                                Category: <span id="editLiveCategoryBadge" th:class="'badge ' + ${record.bmiCategory.badgeClass}"
                                                th:text="${record.bmiCategory.displayName}">Normal Weight</span>
                            </div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">
                                Healthy Range: <span id="editLiveHealthyRange" style="font-weight: 600; color: var(--text-main);">-- kg</span>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary">💾 Update BMI</button>
                        <a th:href="@{/patient/bmi-tracking}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        function updateEditLiveBmi() {
            const h = parseFloat(document.getElementById('editHeightCm').value);
            const w = parseFloat(document.getElementById('editWeightKg').value);
            const bmiEl = document.getElementById('editLiveBmi');
            const badgeEl = document.getElementById('editLiveCategoryBadge');
            const rangeEl = document.getElementById('editLiveHealthyRange');

            if (!h || !w || h <= 0 || w <= 0) {
                bmiEl.innerText = '--';
                badgeEl.innerText = 'Invalid';
                badgeEl.className = 'badge badge-gray';
                rangeEl.innerText = '-- kg';
                return;
            }

            const heightM = h / 100.0;
            const bmi = Math.round((w / (heightM * heightM)) * 100) / 100;
            bmiEl.innerText = bmi.toFixed(2);

            let category = 'Normal Weight';
            let badgeClass = 'badge-green';

            if (bmi < 18.5) {
                category = 'Underweight';
                badgeClass = 'badge-sky';
            } else if (bmi <= 24.9) {
                category = 'Normal Weight';
                badgeClass = 'badge-green';
            } else if (bmi <= 29.9) {
                category = 'Overweight';
                badgeClass = 'badge-amber';
            } else {
                category = 'Obese';
                badgeClass = 'badge-rose';
            }

            badgeEl.innerText = category;
            badgeEl.className = 'badge ' + badgeClass;

            const minWeight = (18.5 * heightM * heightM).toFixed(1);
            const maxWeight = (24.9 * heightM * heightM).toFixed(1);
            rangeEl.innerText = minWeight + ' kg – ' + maxWeight + ' kg';
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', updateEditLiveBmi);
    </script>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
