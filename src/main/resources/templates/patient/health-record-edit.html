<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Health Record - NutriCheck')}"></head>
<body>

    <header th:replace="~{fragments/layout :: navbar}"></header>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="main-content">
        <div class="container container-narrow">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">✏️ Edit Health Record</h1>
                    <a th:href="@{/patient/health-records}" class="btn btn-outline btn-sm">&larr; Back</a>
                </div>

                <form th:action="@{/patient/health-records/edit/{id}(id=${record.id})}" th:object="${record}" method="post">
                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Height (cm) *</label>
                            <input type="number" step="0.1" th:field="*{heightCm}" class="form-control" required min="50" max="280">
                            <span class="form-text-error" th:if="${#fields.hasErrors('heightCm')}" th:errors="*{heightCm}"></span>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Weight (kg) *</label>
                            <input type="number" step="0.1" th:field="*{weightKg}" class="form-control" required min="20" max="400">
                            <span class="form-text-error" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></span>
                        </div>
                    </div>

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Systolic BP (mmHg)</label>
                            <input type="number" th:field="*{systolicBp}" class="form-control">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Diastolic BP (mmHg)</label>
                            <input type="number" th:field="*{diastolicBp}" class="form-control">
                        </div>
                    </div>

                    <div class="grid-cols-2">
                        <div class="form-group">
                            <label class="form-label">Blood Sugar (mg/dL)</label>
                            <input type="number" step="0.1" th:field="*{bloodSugar}" class="form-control">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Cholesterol (mg/dL)</label>
                            <input type="number" step="0.1" th:field="*{cholesterol}" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Notes</label>
                        <textarea th:field="*{notes}" class="form-control" rows="3"></textarea>
                    </div>

                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn btn-primary">Update Record</button>
                        <a th:href="@{/patient/health-records}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
