# ===================================================================
# NutriCheck Test Suite Configuration
# ===================================================================
spring.application.name=NutriCheck-Test

# In-memory H2 database configured in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:nutricheck_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test Administrator Credentials (configured specifically for integration test verification)
nutricheck.admin.username=admin
nutricheck.admin.email=admin@nutricheck.com
nutricheck.admin.password=admin123
nutricheck.admin.full-name=System Administrator
nutricheck.admin.phone=+1 555-0199

# Test Security Key
nutricheck.security.remember-me-key=testOnlySecretKeyForAutomatedTesting12345
nutricheck.seed.sample-data=true

# Logging
logging.level.com.nutricheck.nutricheck=INFO
logging.level.org.springframework.security=WARN
